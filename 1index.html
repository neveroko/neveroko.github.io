<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход через GitHub</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --btn: #1f2328;
      --btn-text: #ffffff;
      --error: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #151b23;
        --text: #f0f6fc;
        --muted: #9198a1;
        --border: #3d444d;
        --btn: #f0f6fc;
        --btn-text: #0d1117;
        --error: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(380px, 92vw);
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: var(--muted); }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--btn-text);
      background: var(--btn);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { opacity: .9; }
    button:focus-visible { outline: 3px solid #0969da; outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 16px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .name { font-size: 20px; font-weight: 600; }
    .email { color: var(--muted); word-break: break-all; }
    .error { margin-top: 16px; color: var(--error); font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Не авторизован -->
    <section id="guest">
      <h1>Войдите в аккаунт</h1>
      <p>Используйте свой аккаунт GitHub.</p>
      <button id="login">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Войти через GitHub
      </button>
    </section>

    <!-- Авторизован -->
    <section id="profile" hidden>
      <img id="avatar" class="avatar" alt="Аватар">
      <div id="name" class="name"></div>
      <div id="email" class="email"></div>
      <button id="logout" class="secondary">Выйти</button>
    </section>

    <div id="error" class="error" role="alert" hidden></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
