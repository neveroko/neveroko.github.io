<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой HTML Файл</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Добро пожаловать на мой сайт!</h1>
    <p>Это простой пример HTML файла. Вы можете изменить его по своему усмотрению.</p>
    <p>Для получения дополнительной информации, посетите <a href="https://www.example.com" target="_blank">наш сайт</a>.</p>

</body>
</html>
