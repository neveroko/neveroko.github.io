      text-align: center;

    p { margin: 0 0 20px; color: var(--muted); }

      justify-content: center;

      font: inherit;
      font-weight: 600;
      color: var(--btn-text);
      background: var(--btn);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:focus-visible { outline: 3px solid #0969da; outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: wait; }
