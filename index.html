<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neveroko</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #f0f6fc;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Сделано neveroko</h1>
</body>
</html>
